
{% extends "appointments/base.html" %}

{% block content %}

<h1>Post-Visit Instructions</h1>

<h2>Appointment with {{ appointment.doctor_name }}</h2>

<p>
    Record any recommendations, instructions,
    or follow-up steps provided by your doctor.
</p>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Instruction
    </button>
</form>

<a href="{% url 'appointment_detail' appointment.pk %}">
    Back to Appointment
</a>

{% endblock %}
