
{% extends "appointments/base.html" %}

{% block content %}

<div class="card">

    {% if editing %}
        <h1>Edit Appointment</h1>
    {% else %}
        <h1>Add New Appointment</h1>
    {% endif %}

    <p>
        Enter your appointment information below.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            {% if editing %}
                Save Changes
            {% else %}
                Add Appointment
            {% endif %}
        </button>
    </form>

    <a href="{% url 'dashboard' %}" class="back-link">
        Cancel
    </a>

</div>

{% endblock %}
